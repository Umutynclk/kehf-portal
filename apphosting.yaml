# Firebase App Hosting yapılandırması — KEHF GROUP (kehf-d1b3a)
# Gizli anahtarlar Google Cloud Secret Manager üzerinden sağlanır.
# Komut: firebase apphosting:secrets:set <SECRET_ADI>

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Firebase Web SDK (istemci yapılandırması)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "kehf-d1b3a.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "kehf-d1b3a"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "kehf-d1b3a.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "239126156142"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:239126156142:web:947f70dbe251bcf824a77f"
    availability:
      - BUILD
      - RUNTIME

  # Sunucu tarafı Firebase proje kimliği
  - variable: FIREBASE_PROJECT_ID
    value: "kehf-d1b3a"
    availability:
      - RUNTIME

  # Admin yetkili e-posta listesi (virgülle ayrılmış, yalnızca sunucu)
  - variable: ADMIN_EMAILS
    secret: ADMIN_EMAILS
    availability:
      - RUNTIME

  # Vercel Blob görsel depolama (mevcut yapı korunur)
  - variable: BLOB_READ_WRITE_TOKEN
    secret: BLOB_READ_WRITE_TOKEN
    availability:
      - RUNTIME

  - variable: BLOB_STORE_ID
    value: "store_E4eLQgir33DyB03e"
    availability:
      - RUNTIME
